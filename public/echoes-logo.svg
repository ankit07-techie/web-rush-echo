<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#262936" />
      <stop offset="60%" stop-color="#14151c" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>

    <!-- Metallic Ring Gradients -->
    <linearGradient id="chromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#9ea3b2" />
      <stop offset="50%" stop-color="#363946" />
      <stop offset="75%" stop-color="#c8cddc" />
      <stop offset="100%" stop-color="#181920" />
    </linearGradient>

    <linearGradient id="chromeInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14151d" />
      <stop offset="40%" stop-color="#464a59" />
      <stop offset="70%" stop-color="#d4d8e6" />
      <stop offset="100%" stop-color="#1e2029" />
    </linearGradient>

    <linearGradient id="badgeBevel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8e94a5" />
      <stop offset="50%" stop-color="#2a2c36" />
      <stop offset="100%" stop-color="#121318" />
    </linearGradient>

    <!-- Hair Metallic Gradient -->
    <linearGradient id="chromeHair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#b4b9ca" />
      <stop offset="50%" stop-color="#484c5c" />
      <stop offset="80%" stop-color="#8e94a6" />
      <stop offset="100%" stop-color="#1e202a" />
    </linearGradient>

    <!-- Face Facet Gradients -->
    <linearGradient id="faceLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e6f3" />
      <stop offset="100%" stop-color="#8a90a2" />
    </linearGradient>

    <linearGradient id="faceMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#727788" />
      <stop offset="100%" stop-color="#363945" />
    </linearGradient>

    <linearGradient id="faceDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252730" />
      <stop offset="100%" stop-color="#111216" />
    </linearGradient>

    <!-- Sunglasses Gradient -->
    <linearGradient id="shadesLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="60%" stop-color="#151720" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="shadesGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Purple Chrome Typography Gradient -->
    <linearGradient id="echoesTextGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="32%" stop-color="#d6dae8" />
      <stop offset="48%" stop-color="#8a8fa3" />
      <stop offset="50%" stop-color="#2f1161" />
      <stop offset="70%" stop-color="#7b3ced" />
      <stop offset="88%" stop-color="#a85ff7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 3D Extrusion Shadow Gradient -->
    <linearGradient id="textExtrusion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b0638" />
      <stop offset="100%" stop-color="#080210" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filters -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Dark Plate with Metallic Texture -->
  <rect width="500" height="560" rx="24" fill="url(#bgGlow)" />

  <!-- Subtle Brushed Horizontal Lines on Canvas -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="500" y2="40" />
    <line x1="0" y1="80" x2="500" y2="80" />
    <line x1="0" y1="120" x2="500" y2="120" />
    <line x1="0" y1="160" x2="500" y2="160" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="240" x2="500" y2="240" />
    <line x1="0" y1="280" x2="500" y2="280" />
    <line x1="0" y1="320" x2="500" y2="320" />
    <line x1="0" y1="360" x2="500" y2="360" />
    <line x1="0" y1="400" x2="500" y2="400" />
    <line x1="0" y1="440" x2="500" y2="440" />
    <line x1="0" y1="480" x2="500" y2="480" />
    <line x1="0" y1="520" x2="500" y2="520" />
  </g>

  <!-- ================= EMBLEM BADGE (Top Center) ================= -->
  <g id="emblem-group" transform="translate(250, 195)" filter="url(#badgeShadow)">
    <!-- Outer Deep Shadow Rim -->
    <circle r="156" fill="#07080b" />

    <!-- Outer Chrome Chamfer -->
    <circle r="154" fill="url(#chromeOuter)" />
    <circle r="148" fill="url(#badgeBevel)" />
    <circle r="144" fill="url(#chromeInner)" />

    <!-- Inner Dark Recessed Disc -->
    <circle r="136" fill="#13141b" />
    <circle r="136" fill="url(#bgGlow)" opacity="0.85" />

    <!-- Background Monogram Geometry ('X' & 'E' facets behind the bust) -->
    <g opacity="0.35">
      <!-- Left Angled Strut -->
      <path d="M -110 -90 L -60 -90 L -20 20 L -55 20 Z" fill="url(#chromeOuter)" />
      <path d="M -110 90 L -60 90 L -20 -20 L -55 -20 Z" fill="url(#chromeInner)" />
      <!-- Right Angled Strut -->
      <path d="M 110 -90 L 60 -90 L 20 20 L 55 20 Z" fill="url(#chromeInner)" />
      <path d="M 110 90 L 60 90 L 20 -20 L 55 -20 Z" fill="url(#chromeOuter)" />
      <!-- Central Circular Accent Line -->
      <circle r="118" fill="none" stroke="#686e80" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
    </g>

    <!-- Soundwave Equalizer Waves (Flanking Left & Right) -->
    <!-- Left Soundwaves -->
    <g id="soundwaves-left" stroke="url(#chromeOuter)" stroke-linecap="round" fill="none">
      <!-- Bar 1 (Innermost) -->
      <path d="M -78 -35 A 86 86 0 0 0 -78 35" stroke-width="4.5" opacity="0.95" />
      <!-- Bar 2 -->
      <path d="M -92 -48 A 104 104 0 0 0 -92 48" stroke-width="4" opacity="0.8" />
      <!-- Bar 3 -->
      <path d="M -106 -58 A 122 122 0 0 0 -106 58" stroke-width="3.5" opacity="0.65" />
      <!-- Bar 4 (Outermost) -->
      <path d="M -120 -40 A 136 136 0 0 0 -120 40" stroke-width="3" opacity="0.45" />
    </g>

    <!-- Right Soundwaves -->
    <g id="soundwaves-right" stroke="url(#chromeOuter)" stroke-linecap="round" fill="none">
      <!-- Bar 1 (Innermost) -->
      <path d="M 78 -35 A 86 86 0 0 1 78 35" stroke-width="4.5" opacity="0.95" />
      <!-- Bar 2 -->
      <path d="M 92 -48 A 104 104 0 0 1 92 48" stroke-width="4" opacity="0.8" />
      <!-- Bar 3 -->
      <path d="M 106 -58 A 122 122 0 0 1 106 58" stroke-width="3.5" opacity="0.65" />
      <!-- Bar 4 (Outermost) -->
      <path d="M 120 -40 A 136 136 0 0 1 120 40" stroke-width="3" opacity="0.45" />
    </g>

    <!-- ================= CHROME MAN BUST ================= -->
    <g id="chrome-man">
      <!-- Neck & Shoulders Base -->
      <path d="M -70 120 L -50 78 L -24 94 L 0 98 L 24 94 L 50 78 L 70 120 C 40 135 -40 135 -70 120 Z" fill="url(#faceDark)" stroke="#090a0d" stroke-width="2" />
      <path d="M -45 82 L -20 94 L 0 98 L 20 94 L 45 82 L 30 125 C 10 130 -10 130 -30 125 Z" fill="url(#faceMid)" />

      <!-- High Metallic Collar Plates -->
      <path d="M -24 94 L -18 64 L 0 68 L -8 96 Z" fill="url(#faceLight)" opacity="0.9" />
      <path d="M 24 94 L 18 64 L 0 68 L 8 96 Z" fill="url(#faceMid)" />
      <!-- Collar Center Ridge -->
      <line x1="0" y1="68" x2="0" y2="128" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />

      <!-- Ears (Geometric Mechanical) -->
      <!-- Left Ear -->
      <path d="M -58 -10 L -48 -24 L -48 15 L -56 22 Z" fill="url(#faceDark)" stroke="#0b0c10" stroke-width="1.5" />
      <path d="M -54 -16 L -48 -22 L -48 8 L -52 14 Z" fill="url(#faceLight)" opacity="0.7" />
      <!-- Right Ear -->
      <path d="M 58 -10 L 48 -24 L 48 15 L 56 22 Z" fill="url(#faceDark)" stroke="#0b0c10" stroke-width="1.5" />
      <path d="M 54 -16 L 48 -22 L 48 8 L 52 14 Z" fill="url(#faceMid)" />

      <!-- Face / Head Base Contours -->
      <path d="M -48 -30 L -46 20 L -30 45 L -14 58 L 0 62 L 14 58 L 30 45 L 46 20 L 48 -30 Z" fill="url(#faceDark)" />

      <!-- Jawline & Cheekbone Facets -->
      <!-- Left Cheek & Jaw (Lit from top-left) -->
      <path d="M -46 20 L -30 45 L -12 40 L -20 18 Z" fill="url(#faceLight)" />
      <path d="M -30 45 L -14 58 L 0 60 L -6 44 L -12 40 Z" fill="url(#chromeHair)" />
      <!-- Right Cheek & Jaw (Shadowed) -->
      <path d="M 46 20 L 30 45 L 12 40 L 20 18 Z" fill="url(#faceMid)" />
      <path d="M 30 45 L 14 58 L 0 60 L 6 44 L 12 40 Z" fill="url(#faceDark)" />

      <!-- Chin Block (Sharp Beveled Square/Hexagon) -->
      <polygon points="-12,48 12,48 8,59 -8,59" fill="url(#faceLight)" />
      <polygon points="-8,59 8,59 0,62" fill="url(#faceDark)" />
      <line x1="-10" y1="48" x2="10" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

      <!-- Nose Structure (Beveled Sharp Pyramid) -->
      <polygon points="0,-16 -8,15 0,18" fill="url(#faceLight)" />
      <polygon points="0,-16 8,15 0,18" fill="url(#faceMid)" />
      <line x1="0" y1="-16" x2="0" y2="18" stroke="#ffffff" stroke-width="2" />
      <!-- Philtrum & Mouth Line -->
      <line x1="-10" y1="28" x2="10" y2="28" stroke="#0f1015" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-8" y1="28" x2="8" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.6" />
      <line x1="-6" y1="34" x2="6" y2="34" stroke="#22242e" stroke-width="2" stroke-linecap="round" />

      <!-- Forehead Planes -->
      <polygon points="-46,-30 -22,-52 0,-54 22,-52 46,-30 20,-18 0,-20 -20,-18" fill="url(#faceMid)" />
      <polygon points="-35,-26 -16,-44 0,-46 0,-20 -18,-18" fill="url(#faceLight)" opacity="0.8" />

      <!-- ================= SUNGLASSES ================= -->
      <!-- Frame Shadow -->
      <path d="M -50 -18 L -38 -22 L 0 -18 L 38 -22 L 50 -18 L 46 6 L 24 12 L 5 8 L 0 5 L -5 8 L -24 12 L -46 6 Z" fill="#040508" filter="url(#badgeShadow)" />

      <!-- Metallic Chrome Shades Frame -->
      <path d="M -48 -16 L -36 -20 L 0 -16 L 36 -20 L 48 -16 L 44 8 L 24 14 L 6 9 L 0 6 L -6 9 L -24 14 L -44 8 Z" fill="url(#chromeOuter)" stroke="#1a1c24" stroke-width="1" />

      <!-- Left Lens (Curved Dark Teardrop / Aviator Wayfarer Hybrid) -->
      <path d="M -42 -14 L -8 -13 L -10 6 L -24 11 L -40 5 Z" fill="url(#shadesLens)" />
      <!-- Left Lens Specular Glint Streak -->
      <path d="M -38 -12 L -20 -12 L -32 8 L -38 4 Z" fill="url(#shadesGlint)" />
      <line x1="-36" y1="-10" x2="-22" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      <line x1="-28" y1="-10" x2="-18" y2="3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5" />

      <!-- Right Lens -->
      <path d="M 8 -13 L 42 -14 L 40 5 L 24 11 L 10 6 Z" fill="url(#shadesLens)" />
      <!-- Right Lens Specular Glint Streak -->
      <path d="M 12 -12 L 30 -12 L 18 8 L 12 4 Z" fill="url(#shadesGlint)" />
      <line x1="14" y1="-10" x2="28" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      <line x1="22" y1="-10" x2="32" y2="3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5" />

      <!-- Bridge Accent -->
      <rect x="-3" y="-17" width="6" height="4" fill="#ffffff" rx="1" opacity="0.9" />

      <!-- ================= HAIR (Slicked Pompadour With Ridges) ================= -->
      <g id="hair-group">
        <!-- Main Silhouette -->
        <path d="M -48 -28 C -55 -45 -52 -75 -25 -92 C -10 -102 15 -104 35 -90 C 52 -78 55 -52 48 -28 C 42 -40 28 -55 10 -60 C -10 -65 -32 -52 -48 -28 Z" fill="url(#chromeHair)" stroke="#090a0d" stroke-width="2" />

        <!-- Sculpted Curved Flow Waves -->
        <!-- Ridge 1 (Crown top reflection) -->
        <path d="M -22 -90 C -6 -98 16 -96 32 -86 C 18 -88 -2 -85 -18 -76 Z" fill="#ffffff" opacity="0.85" />
        <!-- Ridge 2 -->
        <path d="M -32 -76 C -12 -88 15 -85 38 -70 C 18 -74 -5 -70 -26 -58 Z" fill="url(#chromeOuter)" />
        <!-- Ridge 3 -->
        <path d="M -40 -60 C -22 -72 10 -68 42 -52 C 20 -58 -2 -54 -32 -42 Z" fill="url(#chromeInner)" />
        <!-- Ridge 4 -->
        <path d="M -45 -44 C -30 -54 5 -50 45 -36 C 24 -40 0 -38 -36 -28 Z" fill="#2b2d39" />
        <!-- Ridge 5 (Left Temple Taper) -->
        <path d="M -46 -30 C -52 -48 -46 -65 -34 -75 C -44 -60 -46 -44 -42 -30 Z" fill="#ffffff" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY LOCKUP (Bottom) ================= -->

  <!-- "ECHOES" Extrusion / 3D Deep Drop Shadow -->
  <g transform="translate(0, 412)" filter="url(#textGlow)">
    <!-- 3D Bottom Layer -->
    <text x="250" y="8" font-family="'Syne', 'Montserrat', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="9" text-anchor="middle" fill="url(#textExtrusion)">
      ECHOES
    </text>
    <!-- 3D Mid Extrusion Layer -->
    <text x="250" y="4" font-family="'Syne', 'Montserrat', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="9" text-anchor="middle" fill="#3c0091">
      ECHOES
    </text>
    <!-- Top Face Metallic Gradient Layer -->
    <text x="250" y="0" font-family="'Syne', 'Montserrat', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="9" text-anchor="middle" fill="url(#echoesTextGradient)" stroke="#ffffff" stroke-width="0.75">
      ECHOES
    </text>

    <!-- Custom Receipt Icon Overlay Inside the Letter 'O' of ECHOES -->
    <!-- The 'O' is the 4th letter in ECHOES. Centered around x = 277 -->
    <g id="receipt-in-letter-o" transform="translate(269, -38)">
      <!-- Receipt Paper Body -->
      <path d="M 0 0 L 16 0 L 16 26 L 13 23 L 10 26 L 7 23 L 4 26 L 0 23 Z" fill="#ffffff" stroke="#120424" stroke-width="1" />
      <!-- Barcode / Printed Thermal Lines on Receipt -->
      <line x1="3" y1="5" x2="13" y2="5" stroke="#1b0638" stroke-width="1.5" />
      <line x1="3" y1="9" x2="11" y2="9" stroke="#7b3ced" stroke-width="1.2" />
      <line x1="3" y1="13" x2="13" y2="13" stroke="#1b0638" stroke-width="1" />
      <line x1="3" y1="17" x2="8" y2="17" stroke="#7b3ced" stroke-width="1.2" />
      <!-- Small checkmark on receipt -->
      <circle cx="12" cy="18" r="1.5" fill="#10b981" />
    </g>
  </g>

  <!-- Specular Light Sheen across ECHOES letters -->
  <g transform="translate(0, 412)" opacity="0.6" pointer-events="none">
    <text x="250" y="-1" font-family="'Syne', 'Montserrat', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="9" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 14">
      ECHOES
    </text>
  </g>

  <!-- "YOUR LIFE, IN RECEIPTS" Subtitle -->
  <g transform="translate(0, 465)">
    <!-- Shadow -->
    <text x="250" y="2" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="800" letter-spacing="6.5" text-anchor="middle" fill="#000000" opacity="0.9">
      YOUR LIFE, IN RECEIPTS
    </text>
    <!-- Platinum Silver Foreground -->
    <text x="250" y="0" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="800" letter-spacing="6.5" text-anchor="middle" fill="#c8cddc">
      YOUR LIFE, IN RECEIPTS
    </text>
  </g>

  <!-- Bottom Accent Terminal Dots & Barcode -->
  <g transform="translate(250, 508)" opacity="0.55">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="#484d60" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#7b3ced" />
    <circle cx="-8" cy="0" r="1.5" fill="#d4d8e6" />
    <circle cx="8" cy="0" r="1.5" fill="#d4d8e6" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="#484d60" stroke-width="1" />
  </g>
</svg>
