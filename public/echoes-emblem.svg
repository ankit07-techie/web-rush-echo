<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="emblemBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#262936" />
      <stop offset="60%" stop-color="#14151c" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>

    <linearGradient id="embChromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#9ea3b2" />
      <stop offset="50%" stop-color="#363946" />
      <stop offset="75%" stop-color="#c8cddc" />
      <stop offset="100%" stop-color="#181920" />
    </linearGradient>

    <linearGradient id="embChromeInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14151d" />
      <stop offset="40%" stop-color="#464a59" />
      <stop offset="70%" stop-color="#d4d8e6" />
      <stop offset="100%" stop-color="#1e2029" />
    </linearGradient>

    <linearGradient id="embBadgeBevel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8e94a5" />
      <stop offset="50%" stop-color="#2a2c36" />
      <stop offset="100%" stop-color="#121318" />
    </linearGradient>

    <linearGradient id="embChromeHair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#b4b9ca" />
      <stop offset="50%" stop-color="#484c5c" />
      <stop offset="80%" stop-color="#8e94a6" />
      <stop offset="100%" stop-color="#1e202a" />
    </linearGradient>

    <linearGradient id="embFaceLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e6f3" />
      <stop offset="100%" stop-color="#8a90a2" />
    </linearGradient>

    <linearGradient id="embFaceMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#727788" />
      <stop offset="100%" stop-color="#363945" />
    </linearGradient>

    <linearGradient id="embFaceDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252730" />
      <stop offset="100%" stop-color="#111216" />
    </linearGradient>

    <linearGradient id="embShadesLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="60%" stop-color="#151720" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="embShadesGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="translate(160, 160)">
    <!-- Outer Rim -->
    <circle r="156" fill="#07080b" />
    <circle r="154" fill="url(#embChromeOuter)" />
    <circle r="148" fill="url(#embBadgeBevel)" />
    <circle r="144" fill="url(#embChromeInner)" />
    <circle r="136" fill="#13141b" />
    <circle r="136" fill="url(#emblemBgGlow)" opacity="0.85" />

    <!-- Monogram Geometry in Background -->
    <g opacity="0.35">
      <path d="M -110 -90 L -60 -90 L -20 20 L -55 20 Z" fill="url(#embChromeOuter)" />
      <path d="M -110 90 L -60 90 L -20 -20 L -55 -20 Z" fill="url(#embChromeInner)" />
      <path d="M 110 -90 L 60 -90 L 20 20 L 55 20 Z" fill="url(#embChromeInner)" />
      <path d="M 110 90 L 60 90 L 20 -20 L 55 -20 Z" fill="url(#embChromeOuter)" />
      <circle r="118" fill="none" stroke="#686e80" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
    </g>

    <!-- Soundwaves -->
    <g stroke="url(#embChromeOuter)" stroke-linecap="round" fill="none">
      <path d="M -78 -35 A 86 86 0 0 0 -78 35" stroke-width="4.5" opacity="0.95" />
      <path d="M -92 -48 A 104 104 0 0 0 -92 48" stroke-width="4" opacity="0.8" />
      <path d="M -106 -58 A 122 122 0 0 0 -106 58" stroke-width="3.5" opacity="0.65" />
      <path d="M -120 -40 A 136 136 0 0 0 -120 40" stroke-width="3" opacity="0.45" />

      <path d="M 78 -35 A 86 86 0 0 1 78 35" stroke-width="4.5" opacity="0.95" />
      <path d="M 92 -48 A 104 104 0 0 1 92 48" stroke-width="4" opacity="0.8" />
      <path d="M 106 -58 A 122 122 0 0 1 106 58" stroke-width="3.5" opacity="0.65" />
      <path d="M 120 -40 A 136 136 0 0 1 120 40" stroke-width="3" opacity="0.45" />
    </g>

    <!-- Chrome Man Bust -->
    <path d="M -70 120 L -50 78 L -24 94 L 0 98 L 24 94 L 50 78 L 70 120 C 40 135 -40 135 -70 120 Z" fill="url(#embFaceDark)" stroke="#090a0d" stroke-width="2" />
    <path d="M -45 82 L -20 94 L 0 98 L 20 94 L 45 82 L 30 125 C 10 130 -10 130 -30 125 Z" fill="url(#embFaceMid)" />

    <!-- Collar -->
    <path d="M -24 94 L -18 64 L 0 68 L -8 96 Z" fill="url(#embFaceLight)" opacity="0.9" />
    <path d="M 24 94 L 18 64 L 0 68 L 8 96 Z" fill="url(#embFaceMid)" />
    <line x1="0" y1="68" x2="0" y2="128" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />

    <!-- Ears -->
    <path d="M -58 -10 L -48 -24 L -48 15 L -56 22 Z" fill="url(#embFaceDark)" stroke="#0b0c10" stroke-width="1.5" />
    <path d="M -54 -16 L -48 -22 L -48 8 L -52 14 Z" fill="url(#embFaceLight)" opacity="0.7" />
    <path d="M 58 -10 L 48 -24 L 48 15 L 56 22 Z" fill="url(#embFaceDark)" stroke="#0b0c10" stroke-width="1.5" />
    <path d="M 54 -16 L 48 -22 L 48 8 L 52 14 Z" fill="url(#embFaceMid)" />

    <!-- Head Contour -->
    <path d="M -48 -30 L -46 20 L -30 45 L -14 58 L 0 62 L 14 58 L 30 45 L 46 20 L 48 -30 Z" fill="url(#embFaceDark)" />

    <!-- Cheeks and Jawline -->
    <path d="M -46 20 L -30 45 L -12 40 L -20 18 Z" fill="url(#embFaceLight)" />
    <path d="M -30 45 L -14 58 L 0 60 L -6 44 L -12 40 Z" fill="url(#embChromeHair)" />
    <path d="M 46 20 L 30 45 L 12 40 L 20 18 Z" fill="url(#embFaceMid)" />
    <path d="M 30 45 L 14 58 L 0 60 L 6 44 L 12 40 Z" fill="url(#embFaceDark)" />

    <!-- Chin -->
    <polygon points="-12,48 12,48 8,59 -8,59" fill="url(#embFaceLight)" />
    <polygon points="-8,59 8,59 0,62" fill="url(#embFaceDark)" />
    <line x1="-10" y1="48" x2="10" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

    <!-- Nose -->
    <polygon points="0,-16 -8,15 0,18" fill="url(#embFaceLight)" />
    <polygon points="0,-16 8,15 0,18" fill="url(#embFaceMid)" />
    <line x1="0" y1="-16" x2="0" y2="18" stroke="#ffffff" stroke-width="2" />
    <line x1="-10" y1="28" x2="10" y2="28" stroke="#0f1015" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-8" y1="28" x2="8" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.6" />

    <!-- Forehead -->
    <polygon points="-46,-30 -22,-52 0,-54 22,-52 46,-30 20,-18 0,-20 -20,-18" fill="url(#embFaceMid)" />
    <polygon points="-35,-26 -16,-44 0,-46 0,-20 -18,-18" fill="url(#embFaceLight)" opacity="0.8" />

    <!-- Sunglasses -->
    <path d="M -50 -18 L -38 -22 L 0 -18 L 38 -22 L 50 -18 L 46 6 L 24 12 L 5 8 L 0 5 L -5 8 L -24 12 L -46 6 Z" fill="#040508" />
    <path d="M -48 -16 L -36 -20 L 0 -16 L 36 -20 L 48 -16 L 44 8 L 24 14 L 6 9 L 0 6 L -6 9 L -24 14 L -44 8 Z" fill="url(#embChromeOuter)" stroke="#1a1c24" stroke-width="1" />
    <path d="M -42 -14 L -8 -13 L -10 6 L -24 11 L -40 5 Z" fill="url(#embShadesLens)" />
    <path d="M -38 -12 L -20 -12 L -32 8 L -38 4 Z" fill="url(#embShadesGlint)" />
    <line x1="-36" y1="-10" x2="-22" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="-28" y1="-10" x2="-18" y2="3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5" />

    <path d="M 8 -13 L 42 -14 L 40 5 L 24 11 L 10 6 Z" fill="url(#embShadesLens)" />
    <path d="M 12 -12 L 30 -12 L 18 8 L 12 4 Z" fill="url(#embShadesGlint)" />
    <line x1="14" y1="-10" x2="28" y2="7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <line x1="22" y1="-10" x2="32" y2="3" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5" />
    <rect x="-3" y="-17" width="6" height="4" fill="#ffffff" rx="1" opacity="0.9" />

    <!-- Hair -->
    <path d="M -48 -28 C -55 -45 -52 -75 -25 -92 C -10 -102 15 -104 35 -90 C 52 -78 55 -52 48 -28 C 42 -40 28 -55 10 -60 C -10 -65 -32 -52 -48 -28 Z" fill="url(#embChromeHair)" stroke="#090a0d" stroke-width="2" />
    <path d="M -22 -90 C -6 -98 16 -96 32 -86 C 18 -88 -2 -85 -18 -76 Z" fill="#ffffff" opacity="0.85" />
    <path d="M -32 -76 C -12 -88 15 -85 38 -70 C 18 -74 -5 -70 -26 -58 Z" fill="url(#embChromeOuter)" />
    <path d="M -40 -60 C -22 -72 10 -68 42 -52 C 20 -58 -2 -54 -32 -42 Z" fill="url(#embChromeInner)" />
    <path d="M -45 -44 C -30 -54 5 -50 45 -36 C 24 -40 0 -38 -36 -28 Z" fill="#2b2d39" />
    <path d="M -46 -30 C -52 -48 -46 -65 -34 -75 C -44 -60 -46 -44 -42 -30 Z" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
